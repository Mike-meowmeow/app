# Nginx site for the EVSU recruitment system (see deploy/DEPLOY.md).
# Replace recruitment.example.edu.ph and the certificate paths with real values.

upstream evsu_recruitment {
    server unix:/run/evsu-recruitment/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name recruitment.example.edu.ph;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name recruitment.example.edu.ph;

    ssl_certificate     /etc/ssl/certs/recruitment.crt;
    ssl_certificate_key /etc/ssl/private/recruitment.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;   # keep above the largest document type size limit

    # Public static assets only (CSS, JS, images). Never the private folder.
    location /static/ {
        alias /srv/evsu-recruitment/staticfiles/;
        expires 7d;
        access_log off;
    }

    # Private files: reachable only through X-Accel-Redirect from Django, after
    # the permission check (PRIVATE_FILE_DELIVERY=nginx). Direct requests get 404.
    location /protected/ {
        internal;
        alias /srv/evsu-recruitment/private/;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
    }

    location / {
        proxy_pass http://evsu_recruitment;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 130s;
    }
}
