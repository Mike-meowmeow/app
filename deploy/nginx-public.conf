# PUBLIC applicant site (see deploy/DEPLOY.md, section 6).
# The school router forwards internet ports 80 -> 8080 and 443 -> 8443 of this
# server. Those two ports serve only this site, so nothing from the internet can
# reach the staff site, whatever host name a request claims.
# Replace apply.example.edu.ph and the certificate paths with real values.

limit_req_zone $binary_remote_addr zone=evsu_public_auth:10m rate=10r/m;

upstream evsu_public {
    server unix:/run/evsu-recruitment-public/gunicorn.sock fail_timeout=0;
}

# Requests for any other host name are dropped.
server {
    listen 8080 default_server;
    listen 8443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 8080;
    server_name apply.example.edu.ph;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name apply.example.edu.ph;

    ssl_certificate     /etc/letsencrypt/live/apply.example.edu.ph/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apply.example.edu.ph/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;   # keep above the largest document type size limit

    location /static/ {
        alias /srv/evsu-recruitment/staticfiles/;
        expires 7d;
        access_log off;
    }

    # Private files: only through X-Accel-Redirect after Django's permission check.
    location /protected/ {
        internal;
        alias /srv/evsu-recruitment/private/;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
    }

    # Second barrier: Django already answers 404 for these on the public site.
    location ~ ^/(admin|rosters|committee|analytics|audit|operations|recruitment/manage|accounts/staff|accounts/admin)(/|$) {
        return 404;
    }

    # Slow down password guessing and sign-up floods.
    location ~ ^/accounts/(login|register|password/reset|verify/resend)/ {
        limit_req zone=evsu_public_auth burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/evsu-proxy.conf;
        proxy_pass http://evsu_public;
    }

    location / {
        include /etc/nginx/snippets/evsu-proxy.conf;
        proxy_pass http://evsu_public;
    }
}
