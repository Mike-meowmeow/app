# STAFF site, school network only (see deploy/DEPLOY.md, section 6).
# Never forward ports 80 or 443 of this server from the router.
# Replace 192.0.2.10 (this server's school-network address), 192.0.2.0/24 (the
# school network), staff host name, and certificate paths with real values.

upstream evsu_staff {
    server unix:/run/evsu-recruitment-staff/gunicorn.sock fail_timeout=0;
}

server {
    listen 192.0.2.10:80 default_server;
    server_name _;
    return 301 https://recruit-staff.example.edu.ph$request_uri;
}

server {
    listen 192.0.2.10:443 ssl default_server;
    http2 on;
    server_name recruit-staff.example.edu.ph;

    ssl_certificate     /etc/ssl/certs/evsu-staff.crt;
    ssl_certificate_key /etc/ssl/private/evsu-staff.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    allow 192.0.2.0/24;
    deny all;

    client_max_body_size 25m;

    if ($host != "recruit-staff.example.edu.ph") {
        return 444;
    }

    location /static/ {
        alias /srv/evsu-recruitment/staticfiles/;
        expires 7d;
        access_log off;
    }

    location /protected/ {
        internal;
        alias /srv/evsu-recruitment/private/;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
    }

    location / {
        include /etc/nginx/snippets/evsu-proxy.conf;
        proxy_pass http://evsu_staff;
    }
}
