# STAFF site (see deploy/DEPLOY.md, section 6).
# Reachable from the internet with no address restriction; access is protected
# by staff-only accounts, sign-in limits, and the rate limit below. The catch-all
# server for unknown host names is in nginx-public.conf.
# Replace recruit-staff.example.edu.ph and the certificate paths with real values.

limit_req_zone $binary_remote_addr zone=evsu_staff_auth:10m rate=10r/m;

upstream evsu_staff {
    server unix:/run/evsu-recruitment-staff/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name recruit-staff.example.edu.ph;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name recruit-staff.example.edu.ph;

    ssl_certificate     /etc/letsencrypt/live/recruit-staff.example.edu.ph/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recruit-staff.example.edu.ph/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # To limit the staff site to one network later (for example the school's),
    # add here:   allow 192.0.2.0/24;   deny all;

    client_max_body_size 25m;

    location /static/ {
        alias /srv/evsu-recruitment/staticfiles/;
        expires 7d;
        access_log off;
    }

    location /protected/ {
        internal;
        alias /srv/evsu-recruitment/private/;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
    }

    # Slow down password guessing against staff accounts.
    location ~ ^/(accounts/staff/login|accounts/password/reset|admin/login)/ {
        limit_req zone=evsu_staff_auth burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/evsu-proxy.conf;
        proxy_pass http://evsu_staff;
    }

    location / {
        include /etc/nginx/snippets/evsu-proxy.conf;
        proxy_pass http://evsu_staff;
    }
}
