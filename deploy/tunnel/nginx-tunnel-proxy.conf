# Installed as /etc/nginx/snippets/evsu-tunnel-proxy.conf (see deploy/TUNNEL.md).
proxy_set_header Host $host;
# $remote_addr is the visitor's address here (real_ip in nginx-tunnel.conf).
proxy_set_header X-Forwarded-For $remote_addr;
# Visitors always reach Cloudflare over HTTPS ("Always Use HTTPS"); the hop from
# cloudflared to Nginx is local plain HTTP, so state the original scheme.
proxy_set_header X-Forwarded-Proto https;
proxy_redirect off;
proxy_read_timeout 130s;
