# Both sites behind a Cloudflare Tunnel (see deploy/TUNNEL.md).
# Installed as /etc/nginx/sites-available/evsu-tunnel.
#
# Cloudflare holds the HTTPS certificates; cloudflared on this server forwards
# each request to http://127.0.0.1:8080 with the original host name. Nginx
# listens on 127.0.0.1 only, so nothing here is reachable from the network: no
# ports 80/443 need to be open in the firewall.

# The visitor's real address. Cloudflare sets CF-Connecting-IP at its edge
# (overwriting any value a visitor sends). It is trusted only from cloudflared
# on this machine; $remote_addr then holds the visitor's address, which the
# rate limits below and Django's audit trail and sign-in limits use.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header CF-Connecting-IP;

limit_req_zone $binary_remote_addr zone=evsu_public_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=evsu_staff_auth:10m rate=10r/m;

upstream evsu_prod_public {
    server unix:/run/evsu-prod-public/gunicorn.sock fail_timeout=0;
}

upstream evsu_prod_staff {
    server unix:/run/evsu-prod-staff/gunicorn.sock fail_timeout=0;
}

# Unknown host names: close the connection.
server {
    listen 127.0.0.1:8080 default_server;
    server_name _;
    return 444;
}

# The bare domain and www go to the applicant site.
server {
    listen 127.0.0.1:8080;
    server_name evsuocc-recruitment.online www.evsuocc-recruitment.online;
    return 301 https://apply.evsuocc-recruitment.online$request_uri;
}

# PUBLIC applicant site.
server {
    listen 127.0.0.1:8080;
    server_name apply.evsuocc-recruitment.online;

    client_max_body_size 25m;   # keep above the largest document type size limit

    location /static/ {
        alias /srv/evsu-prod/staticfiles/;
        expires 7d;
        access_log off;
    }

    # Private files: only through X-Accel-Redirect after Django's permission check.
    location /protected/ {
        internal;
        alias /srv/evsu-prod/private/;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
    }

    # Second barrier: Django already answers 404 for these on the public site.
    location ~ ^/(admin|rosters|committee|analytics|audit|operations|recruitment/manage|accounts/staff|accounts/admin)(/|$) {
        return 404;
    }

    location ~ ^/accounts/(login|register|password/reset|verify/resend)/ {
        limit_req zone=evsu_public_auth burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/evsu-tunnel-proxy.conf;
        proxy_pass http://evsu_prod_public;
    }

    location / {
        include /etc/nginx/snippets/evsu-tunnel-proxy.conf;
        proxy_pass http://evsu_prod_public;
    }
}

# STAFF site.
server {
    listen 127.0.0.1:8080;
    server_name staff.evsuocc-recruitment.online;

    client_max_body_size 25m;

    location /static/ {
        alias /srv/evsu-prod/staticfiles/;
        expires 7d;
        access_log off;
    }

    location /protected/ {
        internal;
        alias /srv/evsu-prod/private/;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
    }

    location ~ ^/(accounts/staff/login|accounts/password/reset|admin/login)/ {
        limit_req zone=evsu_staff_auth burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/evsu-tunnel-proxy.conf;
        proxy_pass http://evsu_prod_staff;
    }

    location / {
        include /etc/nginx/snippets/evsu-tunnel-proxy.conf;
        proxy_pass http://evsu_prod_staff;
    }
}
