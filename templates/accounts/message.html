{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-8 col-lg-6">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h4">{{ title }}</h1>
    <p>{{ message }}</p>
    {% if show_login %}<a class="btn btn-primary" href="{% url 'accounts:login' %}">Sign in</a>{% endif %}
    {% if show_resend %}<a class="btn btn-outline-secondary" href="{% url 'accounts:resend_verification' %}">Send a new verification link</a>{% endif %}
  </div></div>
</div></div>
{% endblock %}
