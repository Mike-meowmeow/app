{% if form.errors %}
<div class="alert alert-danger" role="alert">
  {% for error in form.non_field_errors %}<div>{{ error }}</div>{% endfor %}
  <ul class="mb-0 ps-3">
    {% for field in form %}{% if field.errors %}<li><strong>{{ field.label }}</strong>: {{ field.errors|join:" " }}</li>{% endif %}{% endfor %}
  </ul>
</div>
{% endif %}
