{% for v in docs %}<a href="{% url 'documents:download' v.pk %}?inline=1" target="_blank" rel="noopener">{{ v.document.document_type.name }} v{{ v.version }}</a> <span class="{% if v.verification_status == 'verified' %}text-success{% elif v.verification_status == 'pending' %}text-muted{% else %}text-danger{% endif %}">({{ v.get_verification_status_display }})</span>{% if not forloop.last %} · {% endif %}{% empty %}<span class="text-muted">none uploaded</span>{% endfor %}
