{% extends "base.html" %}
{% block content %}
<h1 class="h4 mb-1">{{ title }}</h1>
<p class="text-muted">{{ description }}</p>
<div class="row g-3">
  {% for label, stage, url in items %}
    <div class="col-sm-6 col-lg-4">
      {% if url %}
        <a class="card shadow-sm workspace-card h-100 text-decoration-none" href="{% url url %}"><div class="card-body">
          <h2 class="h6 text-body">{{ label }}</h2>
          <span class="badge text-bg-success">Open</span>
        </div></a>
      {% else %}
        <div class="card shadow-sm workspace-card h-100 opacity-75"><div class="card-body">
          <h2 class="h6">{{ label }}</h2>
          <span class="badge text-bg-light border">Planned · {{ stage }}</span>
        </div></div>
      {% endif %}
    </div>
  {% endfor %}
</div>
{% endblock %}
