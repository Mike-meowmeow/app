{% extends "base.html" %}
{% block content %}
<h1 class="h4 mb-1">{{ title }}</h1>
<p class="text-muted">{{ description }}</p>
<div class="row g-3">
  {% for label, stage in items %}
    <div class="col-sm-6 col-lg-4">
      <div class="card shadow-sm workspace-card h-100"><div class="card-body">
        <h2 class="h6">{{ label }}</h2>
        <span class="badge text-bg-light border">Planned · {{ stage }}</span>
      </div></div>
    </div>
  {% endfor %}
</div>
{% endblock %}
